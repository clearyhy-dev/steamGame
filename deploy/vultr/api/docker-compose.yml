# API 容器接入已有数据层网络 steamgame-data_default（Redis / MinIO / data-api）
services:
  steam-api:
    build: .
    image: steamgame-api:local
    container_name: steamgame-api
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file: .env
    networks:
      - data_net
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  data_net:
    external: true
    name: steamgame-data_default
